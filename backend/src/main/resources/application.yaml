server:
  port: ${PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: buscsal
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dbBuscsal}
    username: ${DATABASE_USERNAME:postgres} #Variavel de Ambiente
    password: ${DATABASE_PASSWORD:12345} #Variavel de Ambiente
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jwt:
    expiration: ${JWT_EXPIRATION:86400000} #24 horas
    key: ${JWT_KEY:5P00Qvu+B0OFAKrDRikLhf46mhlwTz18UAF/E01tjYIY3m6U808DcJLkaSk6AOFQJMS7LdVLe2E5DeT8yyDCww==}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    admin:
      nome: ${BOOTSTRAP_ADMIN_NAME:admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin}
      senha: ${BOOTSTRAP_ADMIN_PASSWORD}