spring:
  application:
    name: buscsal
  datasource:
    url: jdbc:postgresql://localhost:5432/dbBuscsal
    username: ${DATABASE_USERNAME:postgres} #Variavel de Ambiente
    password: ${DATABASE_PASSWORD:12345} #Variavel de Ambiente
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jwt:
    expiration: ${JWT_EXPIRATION:90000} #15 MINUTOS
    key: ${JWT_KEY}